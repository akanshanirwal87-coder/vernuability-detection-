services:
  db:
    image: postgres:16-alpine
    container_name: securecode-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-securecode}
      POSTGRES_USER: ${POSTGRES_USER:-securecode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securecode_dev_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-securecode} -d ${POSTGRES_DB:-securecode}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - securecode-network

  redis:
    image: redis:7-alpine
    container_name: securecode-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - securecode-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: securecode-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-securecode}:${POSTGRES_PASSWORD:-securecode_dev_secret}@db:5432/${POSTGRES_DB:-securecode}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ENVIRONMENT: ${ENVIRONMENT:-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-insecure_default_secret_key_change_in_production_32b}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:3000,http://127.0.0.1}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - securecode-network

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: securecode-celery-worker
    restart: unless-stopped
    command: celery -A backend.workers.celery_app worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-securecode}:${POSTGRES_PASSWORD:-securecode_dev_secret}@db:5432/${POSTGRES_DB:-securecode}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ENVIRONMENT: ${ENVIRONMENT:-production}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - securecode-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: securecode-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - securecode-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  securecode-network:
    driver: bridge
