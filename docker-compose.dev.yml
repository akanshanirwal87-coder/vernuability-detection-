# Docker Compose configuration for local development with live code reloading
services:
  backend:
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      ENVIRONMENT: development
      DEBUG: "True"
    volumes:
      - ./backend:/app/backend
      - ./docker:/app/docker

  celery_worker:
    command: celery -A backend.workers.celery_app worker --loglevel=debug --concurrency=2
    environment:
      ENVIRONMENT: development
      DEBUG: "True"
    volumes:
      - ./backend:/app/backend

  db:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"
