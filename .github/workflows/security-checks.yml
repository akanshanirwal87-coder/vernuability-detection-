name: Security SAST & Dependency Audit

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    - cron: "0 4 * * 1" # Weekly Monday at 04:00 UTC

jobs:
  python-security:
    name: Backend SAST & Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security scanning tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Run Bandit AST SAST on Backend
        run: |
          bandit -r backend/ -ll -ii -x backend/tests/ -f json -o bandit-report.json || true
          bandit -r backend/ -ll -ii -x backend/tests/

      - name: Run Pip Audit on Dependencies
        run: |
          pip-audit -r backend/requirements.txt || true

  npm-security:
    name: Frontend Dependency Audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run npm audit
        run: npm audit --audit-level=high || true
