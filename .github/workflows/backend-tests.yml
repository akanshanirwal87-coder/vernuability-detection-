name: Backend Tests & Coverage

on:
  push:
    branches: [ main, master, develop, "upgrade/**" ]
    paths:
      - "backend/**"
      - "tests/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - "backend/**"
      - "tests/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    name: Pytest & Coverage
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r backend/requirements.txt
          pip install flake8

      - name: Lint with Flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 backend --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Run Test Suite with Pytest & Coverage
        env:
          PYTHONPATH: backend
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
          DEBUG: "False"
        run: |
          pytest backend/tests/ tests/ --cov=backend --cov-report=xml --cov-report=term-missing -v

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: coverage.xml
          retention-days: 7
